<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Smaran Aramballi Sandarsh. Ask my agent anything at smaranz.me">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.9s cubic-bezier(.22,1,.36,1) forwards; }
    .d2 { animation-delay: .55s; animation-duration: .35s; }
    .d3 { animation-delay: .8s; animation-duration: .25s; }
    .rise { opacity: 0; transform: translateY(10px); animation: rise .7s cubic-bezier(.22,1,.36,1) forwards; }
    .r1 { animation-delay: .35s; } .r2 { animation-delay: .5s; } .r3 { animation-delay: .7s; }
    .caret { animation: blink 1.1s steps(1) 1.4s infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .draw, .rise, .caret { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
  </style>
  <g transform="translate(468 34)" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect class="draw" pathLength="1" x="6" y="10" width="52" height="44" rx="14"/>
    <path class="draw d2" pathLength="1" d="M21 26l7 6-7 6"/>
    <path class="draw d3" pathLength="1" d="M33 39h10"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text class="rise r1" x="500" y="172" font-size="46" font-weight="500" letter-spacing="-1.2" fill="#e6edf3">Smaran Aramballi Sandarsh</text>
    <text class="rise r2" x="500" y="214" font-size="19" fill="#8b949e">15 · Cupertino, CA · I build agents, apps, and hackathons</text>
  </g>
  <g class="rise r3">
    <rect x="190" y="262" width="620" height="68" rx="24" fill="#161b22" stroke="#30363d"/>
    <rect class="caret" x="222" y="283" width="2" height="26" rx="1" fill="#e6edf3"/>
    <text x="236" y="303" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#6e7681">Ask my agent anything about me</text>
    <circle cx="770" cy="296" r="20" fill="#3f76ee"/>
    <path d="M770 305v-18M762 294l8-8 8 8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="500" y="372" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#6e7681">smaranz.me</text>
  </g>
</svg>
